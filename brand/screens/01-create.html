<body><div class="phone bg-background text-foreground font-sans"><div class="h-11 px-6 flex items-center justify-between text-[15px] font-bold text-foreground"><span>9:41</span>

<div class="px-5 pt-3 space-y-2.5">

<div class="grid grid-cols-[1fr_120px] gap-3">
<label class="block"><span class="text-small font-bold">Amount per person</span><div class="mt-1.5"><div class="h-11 px-4 rounded-xl border-2 border-border bg-card flex items-center gap-2 text-body font-semibold"><span class="text-muted-foreground font-bold">₦</span><span class="flex-1">20,000</span></div></div><p class="text-small text-muted-foreground mt-1">≈ $13.40 each round</p></label>

<label class="block"><span class="text-small font-bold">First payment due</span><div class="mt-1.5"><div class="h-11 px-4 rounded-xl border-2 border-border bg-card flex items-center gap-2 text-body font-semibold"><span class="flex-1">Wed 25 Nov 2026</span><i data-lucide="calendar-days" class="w-5 h-5 text-muted-foreground"></i></div></div></label>
<div><span class="text-small font-bold">Who gets paid when</span>
<div class="mt-1.5 space-y-2">
<div class="rounded-xl border-2 border-primary bg-primary-soft/50 p-3 flex gap-3"><span class="mt-0.5 w-5 h-5 rounded-full border-[6px] border-primary bg-card shrink-0"></span><div><div class="text-body font-bold">Kolo suggests <span class="ml-1 text-[11px] font-bold uppercase tracking-wide text-primary">Recommended</span></div><div class="text-small text-muted-foreground">Kolo orders payouts from how people pay, and tells you when it changes anything.</div></div></div>
<div class="rounded-xl border-2 border-border bg-card p-3 flex gap-3"><span class="mt-0.5 w-5 h-5 rounded-full border-2 border-border shrink-0"></span><div><div class="text-body font-bold">Set it yourself</div><div class="text-small text-muted-foreground">Drag members into order after they join.</div></div></div></div></div>
</div>
<div class="absolute bottom-0 inset-x-0 px-5 pb-7 pt-3 bg-background border-t border-border/70">
<div class="flex justify-between text-small mb-2"><span class="text-muted-foreground">Each payout</span><span><span class="tabular-nums font-bold">₦120,000</span><span class="tabular-nums text-muted-foreground"> · $80.40</span></span></div>
<button class="w-full h-14 text-[16px] rounded-2xl font-bold flex items-center justify-center gap-2 bg-primary text-primary-foreground ">Create circle</button></div></div><script>lucide.createIcons({attrs:{'stroke-width':2.2}})</script></body></html>
